# Text formats with SSL/TLS information
log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] [SSL $ssl_protocol/$ssl_cipher] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [SSL $ssl_protocol/$ssl_cipher] "$http_user_agent" "$http_referer"';

# JSON structured formats for log aggregators (ELK, Loki, etc.)
log_format proxy_json escape=json '{'
	'"time":"$time_iso8601",'
	'"remote_addr":"$remote_addr",'
	'"remote_user":"$remote_user",'
	'"request_method":"$request_method",'
	'"request_uri":"$request_uri",'
	'"status":$status,'
	'"body_bytes_sent":$body_bytes_sent,'
	'"request_time":$request_time,'
	'"upstream_response_time":"$upstream_response_time",'
	'"upstream_status":"$upstream_status",'
	'"upstream_cache_status":"$upstream_cache_status",'
	'"http_referer":"$http_referer",'
	'"http_user_agent":"$http_user_agent",'
	'"http_host":"$http_host",'
	'"server_name":"$server_name",'
	'"scheme":"$scheme",'
	'"ssl_protocol":"$ssl_protocol",'
	'"ssl_cipher":"$ssl_cipher",'
	'"ssl_session_id":"$ssl_session_id",'
	'"gzip_ratio":"$gzip_ratio",'
	'"server":"$server"'
'}';

log_format standard_json escape=json '{'
	'"time":"$time_iso8601",'
	'"remote_addr":"$remote_addr",'
	'"request_method":"$request_method",'
	'"request_uri":"$request_uri",'
	'"status":$status,'
	'"body_bytes_sent":$body_bytes_sent,'
	'"request_time":$request_time,'
	'"http_referer":"$http_referer",'
	'"http_user_agent":"$http_user_agent",'
	'"http_host":"$http_host",'
	'"server_name":"$server_name",'
	'"scheme":"$scheme",'
	'"ssl_protocol":"$ssl_protocol",'
	'"ssl_cipher":"$ssl_cipher",'
	'"gzip_ratio":"$gzip_ratio"'
'}';

access_log /data/logs/fallback_access.log proxy;
